#
# Keeps the Bots & socials board (organization project 4) in step with this
# repository's issues: adds each one, sets its status, stamps the done date on
# close, and reconciles weekly. The job lives in ChiefGyk3D/git-your-ship-together;
# this file only says which board and which Area. It reads two repository
# variables, PROJECTS_APP_ID and DOPPLER_IDENTITY_ID; the GitHub App key comes
# from Doppler over OIDC.
name: Project sync

on:
  issues:
    types: [opened, reopened, closed, edited]
  # No pull_request or pull_request_target trigger: Doppler's OIDC identity
  # cannot cover a pull-request subject (git-your-ship-together#93). Pull
  # requests reach the board through the weekly reconcile below.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-sync-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  sync:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/project-sync.yml@8fdb8d106b11aae0f37e893bb57e9bd8e8b0e7b7 # v1.24.0
    permissions:
      contents: read
      id-token: write
    with:
      project-url: https://github.com/orgs/Renegade-Penguin/projects/4
      app-id: ${{ vars.PROJECTS_APP_ID }}
      default-area-field: Area
      default-area: LLMFAO
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
      egress-policy: block
