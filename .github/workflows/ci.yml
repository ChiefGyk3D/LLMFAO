#
# ruff, ruff format, mypy --strict and pytest on 3.11 to 3.13. The jobs live in
# ChiefGyk3D/git-your-ship-together; its `CI green` job is the one check branch
# protection watches (`ci / CI green`).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@e5c6ec3251cf3a6eea100a1c21736f1818d5efc7 # v1.23.0
    permissions:
      contents: read
      id-token: write   # Doppler OIDC, when a Doppler identity is configured
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      python-versions: '["3.11", "3.12", "3.13"]'
      install-command: |
        python -m pip install --upgrade "pip>=25.3"
        pip install -e ".[dev]"
      test-command: pytest -W error::DeprecationWarning
      lint-install-command: pip install -e ".[dev]"
      lint-command: ruff check --output-format=github src tests && ruff format --check src tests && mypy
      docker-build: false
      egress-policy: block
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
