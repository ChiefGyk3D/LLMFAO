[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmfao"
dynamic = ["version"]
description = "AI-powered, multi-platform interaction engine for livestreams and communities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "ChiefGyk3D" }]
keywords = ["llm", "twitch", "discord", "matrix", "chatbot", "livestream"]
dependencies = [
    "pyyaml>=6.0",
    "hypeman-social>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/ChiefGyk3D/LLMFAO"

[tool.setuptools.dynamic]
version = { attr = "llmfao.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llmfao = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]
warn_unreachable = true
show_error_codes = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = [
    "E501",  # line length is the formatter's
    "SIM300",  # "Yoda" misfires on a constant compared with a literal
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
