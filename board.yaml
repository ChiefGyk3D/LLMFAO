# SPDX-License-Identifier: GPL-3.0-or-later
# The project board for this repository, defined as code for Scrum Around and Find Out (SAFO).
# A user-owned GitHub Project: no App can write one, so it is kept current from the maintainer's own
# `gh` login with `safo --board board.yaml reconcile` (no token is stored in CI).
# How the board is used: docs/wiki/How-This-Project-Is-Planned.md
version: 1
project:
  owner: ChiefGyk3D
  owner_type: user
  number: 6
  title: llmfao
repositories:
  - owner: ChiefGyk3D
    name: LLMFAO
    default_area: Foundation
    area_rules:
      - {match: doppler, area: "Foundation"}
      - {match: safo, area: "Foundation"}
      - {match: classifier, area: "Safety gate"}
      - {match: allowlist, area: "Safety gate"}
      - {match: injection, area: "Safety gate"}
      - {match: safety gate, area: "Safety gate"}
      - {match: streamelements, area: "Tips"}
      - {match: tips, area: "Tips"}
      - {match: twitch, area: "Twitch"}
      - {match: provider, area: "LLM routing"}
      - {match: ollama, area: "LLM routing"}
      - {match: persona, area: "Persona and recaps"}
      - {match: recap, area: "Persona and recaps"}
      - {match: discord, area: "Discord and the bridge"}
      - {match: bridge, area: "Discord and the bridge"}
      - {match: matrix, area: "Discord and the bridge"}
      - {match: docker, area: "Deployment"}
      - {match: compose, area: "Deployment"}
      - {match: container, area: "Deployment"}
      - {match: viewer, area: "Viewer identity and memory"}
      - {match: memory, area: "Viewer identity and memory"}
      - {match: tts, area: "Stream automation (later)"}
      - {match: obs, area: "Stream automation (later)"}
      - {match: queue, area: "Engine core"}
      - {match: cooldown, area: "Engine core"}
      - {match: pipeline, area: "Engine core"}
      - {match: runbook, area: "Docs, wiki and process"}
      - {match: release process, area: "Docs, wiki and process"}
fields:
  - name: Status
    type: single_select
    options:
      - {name: Backlog, color: GRAY, description: "Not scheduled"}
      - {name: Next, color: BLUE, description: "Scheduled for a sprint"}
      - {name: In progress, color: YELLOW, description: "Being worked, or a draft pull request"}
      - {name: In review, color: PURPLE, description: "Pull request open, checks and reviews running"}
      - {name: Blocked, color: RED, description: "Needs the maintainer or an outside answer"}
      - {name: Done, color: GREEN, description: "Closed or merged"}
  - name: Area
    type: single_select
    options:
      - {name: Foundation, color: GRAY, description: "Identity, board, baseline, package layout and config"}
      - {name: Engine core, color: RED, description: "Event model, pipeline, queue, cooldowns, switches"}
      - {name: Twitch, color: PURPLE, description: "Consuming hypeman's Twitch adapter, triggers, events"}
      - {name: Safety gate, color: ORANGE, description: "Rules, classifier, injection handling, allowlist"}
      - {name: LLM routing, color: BLUE, description: "Provider per turn type, Ollama default, opt-in fallback"}
      - {name: Persona and recaps, color: PINK, description: "Persona file, chat buffer, recaps, scheduled lines"}
      - {name: Discord and the bridge, color: BLUE, description: "Discord adapter, the mautrix bridge, Matrix scaffolding"}
      - {name: Tips, color: YELLOW, description: "StreamElements tips and dedupe"}
      - {name: Deployment, color: GREEN, description: "Image, compose, healthcheck, release, cloud variant"}
      - {name: Viewer identity and memory, color: PINK, description: "Opt-in link, short memory, wipe and removal"}
      - {name: "Stream automation (later)", color: ORANGE, description: "TTS, OBS, approval channel (later)"}
      - {name: "Docs, wiki and process", color: GRAY, description: "Runbooks, reference, release process"}
  - name: Size
    type: single_select
    options:
      - {name: S, color: GRAY, description: "About 2 hours"}
      - {name: M, color: BLUE, description: "About 5 hours"}
      - {name: L, color: ORANGE, description: "About 12 hours"}
      - {name: XL, color: RED, description: "About 30 hours: split before scheduling"}
  - name: Priority
    type: single_select
    options:
      - {name: P1 soon, color: ORANGE, description: ""}
      - {name: P2 later, color: YELLOW, description: ""}
      - {name: P3 someday, color: GRAY, description: ""}
  - name: Agent
    type: single_select
    options:
      - {name: Claude, color: ORANGE, description: "Claude lead or a Claude subagent"}
      - {name: Codex, color: GREEN, description: "OpenAI Codex"}
      - {name: Copilot, color: BLUE, description: "GitHub Copilot coding agent"}
      - {name: Local LLM, color: PINK, description: "The local Ollama model, first drafts"}
      - {name: You, color: PURPLE, description: "The maintainer"}
  - {name: Sprint, type: iteration, start: 2026-11-03, duration_days: 14, count: 8, title_prefix: "S"}
  - {name: Start date, type: date}
  - {name: Target date, type: date}
  - {name: Done on, type: date}
views:
  - {name: Sprint board, layout: board, filter: "-status:Done"}
  - {name: Sprint plan, layout: table, filter: "-status:Done"}
  - {name: Roadmap, layout: roadmap, filter: ""}
  - {name: Backlog, layout: table, filter: "status:Backlog"}
  - {name: Agents at work, layout: table, filter: 'status:"In progress","In review",Next'}
rules:
  status:
    opened: Backlog
    opened_pr: In review
    draft_pr: In progress
    reopened: Backlog
    closed: Done
    merged: Done
  done_date_field: Done on
  new_item_defaults:
    Priority: P2 later
agents:
  field: Agent
  working: [In progress, In review, Next]
  waiting: [Blocked]
ui_only:
  - "Board view: Group by = Status; Sprint board: set Group by Status and Sort by Priority"
  - "Roadmap view: Date fields = Start date and Target date, Group by = Area, zoom = Quarter"
  - "Sprint plan view: Group by = Sprint; show Size, Agent, Area"
  - "Project workflows: Item closed -> Done; Pull request merged -> Done; Auto-add is not needed (reconcile adds)"
